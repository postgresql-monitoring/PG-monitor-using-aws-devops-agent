<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="100%" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">AWS DevOps Agent for RDS PostgreSQL investigations</title>
<desc id="arch-desc">Two entry points feed an agent guided by an investigation skill. It consults native telemetry and calls diagnostic tools through AgentCore Gateway. A private Lambda reads credentials and queries RDS. The agent returns findings for human review.</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#65778a"/></marker><marker id="orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#c56817"/></marker></defs>
<rect x="1" y="1" width="958" height="658" rx="16" fill="#f7f9fc" stroke="#d8e1eb"/>
<g font-family="Arial,sans-serif" fill="#26374a">
<text x="30" y="34" font-size="12" font-weight="bold" letter-spacing="2">01  INVESTIGATION TRIGGERS</text>
<rect x="30" y="48" width="260" height="66" rx="10" fill="#fff" stroke="#c4d1df"/><text x="160" y="77" text-anchor="middle" font-size="17" font-weight="bold">On-call engineer</text><text x="160" y="96" text-anchor="middle" font-size="12">Agent Space chat</text>
<rect x="350" y="48" width="260" height="66" rx="10" fill="#fff" stroke="#c4d1df"/><text x="480" y="77" text-anchor="middle" font-size="17" font-weight="bold">CloudWatch alarm</text><text x="480" y="96" text-anchor="middle" font-size="12">Metric threshold breached</text>
<rect x="670" y="48" width="260" height="66" rx="10" fill="#fff" stroke="#c4d1df"/><text x="800" y="77" text-anchor="middle" font-size="17" font-weight="bold">Webhook Lambda</text><text x="800" y="96" text-anchor="middle" font-size="12">HMAC-signed event</text>
<text x="30" y="157" font-size="12" font-weight="bold" letter-spacing="2">02  AGENT SPACE</text>
<rect x="30" y="174" width="260" height="76" rx="10" fill="#edf2fa" stroke="#98afd2"/><text x="160" y="202" text-anchor="middle" font-size="16" font-weight="bold">Investigation skill</text><text x="160" y="222" text-anchor="middle" font-size="12">Triage · Diagnose · Drill down</text><text x="160" y="238" text-anchor="middle" font-size="12">Correlate · Recommend</text>
<rect x="350" y="174" width="260" height="76" rx="10" fill="#24364b"/><text x="480" y="204" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">AWS DevOps Agent</text><text x="480" y="228" text-anchor="middle" font-size="13" fill="#dae6f3">Evidence-driven investigation</text>
<rect x="670" y="174" width="260" height="76" rx="10" fill="#e8f5ee" stroke="#8dbca3"/><text x="800" y="202" text-anchor="middle" font-size="16" font-weight="bold">Investigation report</text><text x="800" y="223" text-anchor="middle" font-size="12">Severity · Evidence · Recommendations</text><text x="800" y="239" text-anchor="middle" font-size="12">Human review</text>
<text x="30" y="294" font-size="12" font-weight="bold" letter-spacing="2">03  NATIVE TELEMETRY</text><text x="350" y="294" font-size="12" font-weight="bold" letter-spacing="2">04  DOMAIN-SPECIFIC MCP DIAGNOSTICS</text>
<rect x="30" y="318" width="260" height="94" rx="10" fill="#edf2fa" stroke="#98afd2"/><text x="160" y="347" text-anchor="middle" font-size="16" font-weight="bold">CloudWatch</text><text x="160" y="368" text-anchor="middle" font-size="14">Database Insights &amp; Logs</text><text x="160" y="390" text-anchor="middle" font-size="12">Metrics · Waits · Historical context</text>
<rect x="350" y="318" width="580" height="94" rx="10" fill="#fff3e5" stroke="#e4a45a"/><text x="640" y="348" text-anchor="middle" font-size="17" font-weight="bold">Amazon Bedrock AgentCore Gateway</text><text x="640" y="370" text-anchor="middle" font-size="13">MCP endpoint · SigV4 authorization · Registered tools</text><text x="640" y="390" text-anchor="middle" font-size="12">Lambda target</text>
<rect x="30" y="458" width="900" height="178" rx="12" fill="#eaf4ef" stroke="#83b99a" stroke-dasharray="6 4"/><text x="52" y="484" font-size="12" font-weight="bold" letter-spacing="1.5">05  SECURE DATABASE ACCESS</text>
<rect x="52" y="504" width="245" height="100" rx="10" fill="#fff" stroke="#83b99a"/><text x="174" y="539" text-anchor="middle" font-size="16" font-weight="bold">AWS Secrets Manager</text><text x="174" y="561" text-anchor="middle" font-size="12">Scoped credential access</text>
<rect x="358" y="504" width="245" height="100" rx="10" fill="#fff" stroke="#83b99a"/><text x="480" y="539" text-anchor="middle" font-size="16" font-weight="bold">Diagnostic Lambda</text><text x="480" y="561" text-anchor="middle" font-size="12">Private VPC · Bounded read-only tools</text>
<rect x="663" y="504" width="245" height="100" rx="10" fill="#fff" stroke="#83b99a"/><text x="785" y="539" text-anchor="middle" font-size="16" font-weight="bold">RDS for PostgreSQL</text><text x="785" y="561" text-anchor="middle" font-size="12">TLS · Monitoring role · Port 5432</text>
</g>
